name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admiral
          POSTGRES_PASSWORD: test
          POSTGRES_DB: admiral_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U admiral"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://admiral:test@localhost:5432/admiral_test?sslmode=disable
      JWT_SECRET: ci-test-secret-needs-32-chars-minimum-please
      APP_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install deps
        working-directory: backend
        run: go mod download

      - name: Lint
        working-directory: backend
        run: go vet ./...

      - name: Apply migrations
        working-directory: backend
        run: go run ./cmd/migrate up

      - name: Run tests
        working-directory: backend
        run: go test -race -coverprofile=coverage.out ./...

      - name: Build
        working-directory: backend
        run: go build -o /tmp/admiral-api ./cmd/api

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: success()
        with:
          file: backend/coverage.out
          flags: backend
        continue-on-error: true

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
        run: npm run build
